name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - run: pip install -r requirements-dev.txt

      - run: pytest -q

  k8s-smoke-test:
    name: Build image and deploy to kind
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: practica-app:local
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Create kind cluster
        uses: helm/kind-action@v1

      - name: Load image into the cluster
        run: kind load docker-image practica-app:local --name chart-testing

      - name: Deploy manifests
        run: |
          kubectl apply -f k8s/
          kubectl -n practica rollout status deployment/practica-app --timeout=120s

      - name: Smoke test
        run: |
          kubectl -n practica port-forward svc/practica-app 8080:80 &
          sleep 3
          curl -fsS http://localhost:8080/health
          curl -fsS http://localhost:8080/

      - name: Debug info on failure
        if: failure()
        run: |
          kubectl -n practica get pods -o wide
          kubectl -n practica describe pods
          kubectl -n practica logs -l app=practica-app --tail=50

  publish:
    name: Publish image to GHCR
    needs: [test, k8s-smoke-test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha
            type=raw,value=latest

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
